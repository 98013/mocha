name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop, staging, production ]
  push:
    branches: [ main, develop, staging, production ]

jobs:
  # ==================================================
  # 1. BUILD & TEST (Runs on PRs and all pushes)
  # ==================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm i || npm ci

      - name: Build Dist Folder
        run: npm run build --if-present

      - name: Run Tests
        run: npm test --if-present

  # ==================================================
  # 2. MAIN DEPLOYMENT
  # ==================================================
  deploy-main:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Script in Pipeline
        run: node dist/javascript.js || node javascript.js

  # ==================================================
  # 3. DEV DEPLOYMENT
  # ==================================================
  deploy-dev:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Script in Pipeline
        run: node dist/javascript.js || node javascript.js

  # ==================================================
  # 4. STAGING DEPLOYMENT
  # ==================================================
  deploy-staging:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Script in Pipeline
        run: node dist/javascript.js || node javascript.js

  # ==================================================
  # 5. PRODUCTION DEPLOYMENT
  # ==================================================
  deploy-production:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Script in Pipeline
        run: node dist/javascript.js || node javascript.js