name: CI/CD Pipeline

on:
  pull_request:
    branches: [ develop, staging, production ]
  push:
    branches: [ develop, staging, production ]

jobs:
  # ==================================================
  # 1. BUILD & TEST (Runs on PRs and all pushes)
  # ==================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Dist Folder
        run: npm run build --if-present

      - name: Run Tests
        run: npm test --if-present

  # ==================================================
  # 2. DEV DEPLOYMENT (Pushes to 'develop' branch)
  # ==================================================
  deploy-dev:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Dist Folder
        run: npm run build --if-present

      - name: Execute Script in Pipeline
        run: node dist/javascript.js || node javascript.js

  # ==================================================
  # 3. STAGING DEPLOYMENT (Pushes to 'staging' branch)
  # ==================================================
  deploy-staging:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Dist Folder
        run: npm run build --if-present

      - name: Execute Script in Pipeline
        run: node dist/javascript.js || node javascript.js

  # ==================================================
  # 4. PRODUCTION DEPLOYMENT (Pushes to 'production' branch)
  # ==================================================
  deploy-production:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Dist Folder
        run: npm run build --if-present

      - name: Execute Script in Pipeline
        run: node dist/javascript.js || node javascript.js